# The agent runner: serves backend/app/api/main.py's /agent/run endpoint
# (LangGraph agent execution). Latency-sensitive, request-driven traffic —
# see ARCHITECTURE.md "Why Kubernetes" for why this is a *separate*
# deployment from the mining service rather than one monolith: this one
# scales on request rate, the mining service scales on queue depth, and
# conflating the two means over- or under-provisioning one to satisfy the
# other's signal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runner
  namespace: agent-regression-flywheel
  labels:
    app: agent-runner
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-runner
  template:
    metadata:
      labels:
        app: agent-runner
    spec:
      containers:
        - name: agent-runner
          image: agent-regression-flywheel/backend:latest
          command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flywheel-config
            - secretRef:
                name: flywheel-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner
  namespace: agent-regression-flywheel
spec:
  selector:
    app: agent-runner
  ports:
    - port: 80
      targetPort: 8000
---
# Scales on request rate (a Prometheus/custom-metrics adapter exposing
# http_requests_per_second is assumed; swap for the cluster's actual
# metrics pipeline). This is the signal that matters for a latency-facing
# API — queue depth means nothing here, there is no queue.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-runner
  namespace: agent-regression-flywheel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-runner
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
