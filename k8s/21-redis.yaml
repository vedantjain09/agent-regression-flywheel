# Ephemeral state only (RedisQueue trace queue, SlidingWindowRateLimiter —
# backend/app/models/queue.py): no PVC, a pod restart just means the
# mining worker re-fills from upstream trace ingestion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flywheel-redis
  namespace: agent-regression-flywheel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flywheel-redis
  template:
    metadata:
      labels:
        app: flywheel-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: flywheel-redis
  namespace: agent-regression-flywheel
spec:
  selector:
    app: flywheel-redis
  ports:
    - port: 6379
