# Non-secret config shared across services, plus a Secret *template* (not
# real values — filled in via `kubectl create secret` or a sealed-secrets /
# external-secrets pipeline in a real cluster, never committed with values).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flywheel-config
  namespace: agent-regression-flywheel
data:
  POSTGRES_DB: "flywheel"
  POSTGRES_HOST: "flywheel-postgres"
  REDIS_HOST: "flywheel-redis"
  TEMPORAL_ADDRESS: "flywheel-temporal:7233"
  SIGNIFICANCE_ALPHA: "0.05"
  MINING_MIN_CLUSTER_SIZE: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: flywheel-secrets
  namespace: agent-regression-flywheel
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  MODAL_TOKEN_ID: "REPLACE_ME"
  MODAL_TOKEN_SECRET: "REPLACE_ME"
  DATADOG_API_KEY: "REPLACE_ME"
  POSTHOG_API_KEY: "REPLACE_ME"
  LANGSMITH_API_KEY: "REPLACE_ME"
